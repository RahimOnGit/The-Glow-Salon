<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
<!--tailwind and htmx set up -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>

</head>
<body class="min-h-screen bg-base-200">
<!--navbar-->
<div class="navbar bg-base-100">
<!--    <div class=" flex-1 justify-center"><a href="/" class="text-xl font-bold ">dashboard</a></div>-->
<div class="navbar-start"></div>
    <div class="navbar-center ">
    <a class="normal-case text-xl font-bold">Dashboard</a>
</div>
    <div class="navbar-end">
        <a href="/login" id="login-link" class="btn btn-primary rounded hidden">Login</a>
        <a href="/logout" id="logout-link" class="btn btn-primary rounded">Logout</a>

    </div>
</div>

<!--hero-->
<div class="hero min-h-screen bg-gradient-to-r from-primary/30 to-secondary/5 ">
    <div class="hero-content flex-col lg:flex-row-reverse">

        <div class="text-center lg:text-left max-w-xl ">
            <h1 class="text-5xl lg-text-6xl font-bold bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">

                <span th:text="${stylist.getFirstName() + ' '+stylist.getLastName()} + '`s schedule'">  stylist name schedule: </span>

            </h1>
            <div th:replace="~{fragments/stylist-appointments::list(
            title=${title},
            appointments=${appointments}
        )}">
                Loading appointments...
            </div>

        </div>
    </div>
</div>

<script>
    // Function to complete appointment
    async function completeAppointment(button) {
        const appointmentId = button.getAttribute('data-appointment-id');

        try {
            const response = await fetch(`/api/appointments/${appointmentId}/complete`,{
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            });
            if(response.ok) {
                // Show success message
                alert('Appointment marked as completed!');
                // Reload the page to see updated status
                location.reload();
            }

            else {
                const error = await response.json();
                alert('Error: ' + error.error);
            }


        } catch (error) {
            console.error('Error completing appointment:', error);
            alert('Network error. Please try again.');
        }
    }
</script>
</body>
</html>
