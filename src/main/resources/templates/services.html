<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <title>Salon Services</title>
    <!-- Tailwind CSS + DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
</head>
<body class="min-h-screen bg-base-200 ">

<!--navbar-->
<div th:replace="fragments/navbar::navbar"> </div>


<!--services section-->
<section class="py-12 px-4 bg-base-100">

    <div
            id="service-list"
            hx-get="/service-view"
            hx-trigger="load"
            hx-target="#service-list"
            hx-swap="innerHTML"
            class="space-y-4"
    >

        <p id="load" class=" text-center text-gray-500">Loading Services...</p>
    </div>

        <a href="booking" class="btn btn btn-primary text-center">Next</a>
</section>

<!--Footer  -->
<div th:replace="fragments/footer ::footer"></div>

</body>
</html>
