<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <title>Salon Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>

</head>
<body class="min-h-screen bg-base-200">

<!--navbar-->
<div th:replace="~{fragments/navbar::navbar}"></div>

<!--services section-->
<section class="py-12 px-4 bg-base-100">
    <div
            id="booking-section"
            hx-get="/service-list-fragment"
            hx-trigger="load"
            hx-target="#booking-section"
            hx-swap="innerHTML"
            class="space-y-4"
    >
        <p class="text-center text-gray-500">Loading Services...</p>
    </div>
</section>

<!-- Login Modal -->
<div id="login-modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-4">Login to Continue Booking</h3>

        <form id="login-form">
            <div class="form-control mb-4">
                <label class="label"><span class="label-text">Email</span></label>
                <input type="email" id="login-email" class="input input-bordered w-full" required />
            </div>

            <div class="form-control mb-6">
                <label class="label"><span class="label-text">Password</span></label>
                <input type="password" id="login-password" class="input input-bordered w-full" required />
            </div>

            <div id="login-error" class="alert alert-error mb-4 hidden">
                <span id="login-error-msg"></span>
            </div>

            <div class="flex gap-2">
                <button type="submit" class="btn btn-primary flex-1">Login</button>
                <button type="button" id="cancel-login" class="btn flex-1">Cancel</button>
            </div>

            <div class="mt-4 text-center">
                <span>you don't have an account? </span>
                <button type="button"  id="show-register" class="underline text-primary"
                        onclick="window.location.href= '/register'">
                    Register</button>
            </div>
        </form>
    </div>
</div>





<!--Footer-->
<div th:replace="~{fragments/footer :: footer}"></div>


<script>
    // Define all functions first to avoid reference errors

    function setMinDate() {
        const dateInput = document.getElementById('date-input');
        if (!dateInput) return;

        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const minDate = `${yyyy}-${mm}-${dd}`;
        dateInput.min = minDate;
    }

    function generateTimeGrid() {
        const timeGrid = document.getElementById('time-grid');
        if (!timeGrid) return;

        const dateInput = document.getElementById('date-input');
        const selectedDate = dateInput ? dateInput.value : '';
        const todayStr = new Date().toISOString().split('T')[0]; // e.g., '2025-11-14'
        const isToday = selectedDate === todayStr;

        let currentHour, currentMinute;
        if (isToday) {
            const now = new Date();
            currentHour = now.getHours();
            currentMinute = now.getMinutes();
        }

        const times = [];
        for (let hour = 9; hour <= 17; hour++) {
            times.push(`${hour.toString().padStart(2, '0')}:00`);
            if (hour < 17) {
                times.push(`${hour.toString().padStart(2, '0')}:30`);
            }
        }

        timeGrid.innerHTML = times.map(time => {
            let buttonClass = 'btn btn-outline btn-sm rounded-full transition-all duration-200 hover:bg-primary hover:text-white';
            let disabledAttr = '';
            let onclickAttr = `onclick="selectTime('${time}')"`; // Default enabled

            if (isToday) {
                const [timeHour, timeMinute] = time.split(':').map(Number);
                const isPastTime = timeHour < currentHour ||
                    (timeHour === currentHour && timeMinute <= currentMinute); // Disable if <= current time

                if (isPastTime) {
                    buttonClass += ' btn-disabled opacity-50 cursor-not-allowed';
                    disabledAttr = 'disabled';
                    onclickAttr = ''; // Remove onclick for disabled
                }
            }

            return `
                <button type="button"
                        class="${buttonClass}"
                        ${disabledAttr}
                        ${onclickAttr}>
                    ${time} ${isToday && disabledAttr ? '' : ''}
                </button>
            `;
        }).join('');

        // Clear selected time if it's now disabled (e.g., user changes date back to today)
        const selectedTime = document.getElementById('selected-time').value;
        if (isToday && selectedTime && !document.querySelector(`#time-grid button[onclick="selectTime('${selectedTime}')"]`)) {
            document.getElementById('selected-time').value = '';
            document.getElementById('selected-time-display').textContent = 'Select a time';
        }
    }

    function selectTime(time) {
        // Check if the button is disabled
        const button = event ? event.target : document.querySelector(`#time-grid button[onclick="selectTime('${time}')"]`);
        if (button && (button.disabled || button.classList.contains('btn-disabled'))) {
            alert('This time slot has already passed. Please select a future time.');
            return;
        }

        document.getElementById('selected-time').value = time;
        document.getElementById('selected-time-display').textContent = `Selected: ${time}`;

        // Highlight selected button
        document.querySelectorAll('#time-grid button').forEach(btn => {
            btn.classList.remove('btn-primary');
            if (btn.textContent.trim().startsWith(time)) {
                btn.classList.add('btn-primary');
            }
        });

        triggerAvailableEmployees();
        checkFormComplete();
        updateSelectedServicesSummary();
    }


    function triggerAvailableEmployees() {
        const locationId = document.getElementById('location-select')?.value;
        const date = document.getElementById('date-input')?.value;
        const time = document.getElementById('selected-time')?.value;
        const serviceIds = getSelectedServiceIds();

        if (locationId && date && time && serviceIds.length > 0) {
            const serviceIdsParam = serviceIds.join(',');
            const url = `/api/appointments/available-employees?locationId=${locationId}&date=${date}&time=${time}&serviceIds=${serviceIdsParam}`;
            htmx.ajax('GET', url, {target: '#stylist-select', swap: 'innerHTML'});
        }
    }

    function checkFormComplete() {
        const location = document.getElementById('location-select')?.value;
        const date = document.getElementById('date-input')?.value;
        const time = document.getElementById('selected-time')?.value;
        const stylist = document.getElementById('stylist-select')?.value;
        const submitBtn = document.getElementById('submit-btn');

        if (submitBtn) {
            submitBtn.disabled = !(location && date && time && stylist);
        }
    }

    // Service selection functions (unchanged)
    function initializeServiceSelection() {
        const serviceForm = document.getElementById('service-selection-form');
        if (!serviceForm) return;

        updateContinueButtonState();  // Initial state

        // Attach change listeners to checkboxes
        const checkboxes = serviceForm.querySelectorAll('.service-checkbox');
        checkboxes.forEach(cb => cb.addEventListener('change', updateContinueButtonState));

        console.log('Service selection initialized');
    }

    //update state of the button (contiune to booking)
    function updateContinueButtonState() {
        const serviceCheckBoxes = document.querySelectorAll('.service-checkbox');
        const isAnyChecked = Array.from(serviceCheckBoxes).some(checkbox => checkbox.checked);
        const continueButton = document.getElementById('continue-to-booking');

        if (continueButton) {
            continueButton.disabled = !isAnyChecked;
        }

        if (isAnyChecked) {
            const selectedServices = Array.from(serviceCheckBoxes)
                .filter(cb => cb.checked)
                .map(cb => {
                    const label = cb.closest('label');
                    const nameElement = label.querySelector('span.font-semibold');
                    const durationElement = label.querySelector('span.text-sm');
                    const priceElement = label.querySelector('span.text-xl');

                    return {
                        id: cb.value,
                        name: nameElement ? nameElement.textContent : 'Service',
                        duration: parseInt(cb.getAttribute('data-duration') || '0'),
                        price: parseFloat(priceElement ? priceElement.textContent.replace(' SEK', '') : 0)
                    };
                });

            // Save IDs and FULL details to sessionStorage
            sessionStorage.setItem('selectedServiceIds', JSON.stringify(selectedServices.map(s => s.id)));
            sessionStorage.setItem('selectedServicesDetails', JSON.stringify(selectedServices));
            console.log('Full service details saved to sessionStorage:', selectedServices);
        } else {
            sessionStorage.removeItem('selectedServiceIds');
            sessionStorage.removeItem('selectedServicesDetails');
        }
    }

    //check if the user is logged in
    async function isLoggedIn() {
        try {
            const res = await fetch('/api/auth/status', { credentials: 'include' });
            const data = await res.json();
            return data.loggedIn === true;
        } catch {
            return false;
        }
    }

    function showLoginModal() {
        const modal = document.getElementById('login-modal');
        modal.classList.add('modal-open');

        // Focus email
        document.getElementById('login-email').focus();
    }

    function hideLoginModal() {
        const modal = document.getElementById('login-modal');
        modal.classList.remove('modal-open');
        document.getElementById('login-form').reset();
        document.getElementById('login-error').classList.add('hidden');
    }

    // Your original booking function
    async function submitBooking() {
        const serviceIds = getSelectedServiceIds();
        if (serviceIds.length === 0) {
            alert('Please select at least one service');
            return;
        }

        const form = document.getElementById('final-booking-form');
        if (!form) {
            alert('Booking form not found');
            return;
        }

        const formData = new FormData(form);
        const payload = {
            serviceIds: serviceIds.map(id => parseInt(id)),
            employeeId: parseInt(formData.get('employeeId')),
            locationId: parseInt(formData.get('locationId')),
            date: formData.get('date'),
            time: formData.get('time')
        };

        console.log('Submitting booking payload:', payload);

        // FIXED: Reliable auth check via /api/auth/status (server reads HttpOnly cookie)
        try {
            console.log('Checking auth status...');
            const authRes = await fetch('/api/auth/status', { credentials: 'include' });
            const authData = await authRes.json();
            console.log('Auth status:', authData);

            if (!authData.loggedIn) {
                alert('Session expired. Please log in again to book an appointment.');
                window.location.href = '/login?redirect=/salon/services';
                return;
            }
            console.log('User authenticated - proceeding with booking');
        } catch (authErr) {
            console.error('Auth check failed:', authErr);
            alert('Unable to verify login. Please log in again.');
            window.location.href = '/login?redirect=/salon/services';
            return;
        }

        try {
            const res = await fetch('/api/appointments/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
                credentials: 'include'  // Ensures HttpOnly cookie is sent
            });

            console.log('Booking response status:', res.status);

            if (res.ok) {
                const result = await res.json();
                console.log('Booking success:', result);
                // Clear sessionStorage on success
                sessionStorage.removeItem('selectedServiceIds');
                sessionStorage.removeItem('selectedServicesDetails');
                // Redirect to confirmation
                window.location.href = `/confirmation?appointmentId=${result.appointmentId}`;
            } else {
                // FIXED: Handle 401 specifically (Unauthorized)
                if (res.status === 401) {
                    console.error('Unauthorized - redirecting to login');
                    alert('Authentication failed. Please log in again.');
                    window.location.href = '/login?redirect=/salon/services';
                    return;
                }

                const result = await res.json();
                console.error('Booking failed:', res.status, result);

                let errorMsg = result.error || 'Failed to book appointment';

                if (errorMsg.includes("not available on the selected date")) {
                    errorMsg = "⚠️ This stylist is not available on the selected date.";
                } else if (errorMsg.includes("already booked") || errorMsg.includes("Time slot conflict")) {
                    errorMsg = "⏰ This time slot is already taken. Please choose another time.";
                }

                const responseEl = document.getElementById('response');
                if (responseEl) {
                    responseEl.innerHTML = `
                        <div class="alert alert-error shadow-lg">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                            <span>${errorMsg}</span>
                        </div>
                    `;
                } else {
                    alert(errorMsg);
                }
                // Stay on page - no redirect on other errors
            }
        } catch (err) {
            console.error('Network error in booking:', err);
            const responseEl = document.getElementById('response');
            if (responseEl) {
                responseEl.innerHTML = `<div class="alert alert-error">Network error: ${err.message}</div>`;
            } else {
                alert(`Network error: ${err.message}`);
            }
        }
    }

    // Handle login form
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const errorEl = document.getElementById('login-error');
        const errorMsg = document.getElementById('login-error-msg');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password }),
                credentials: 'include'
            });

            const data = await res.json();

            if (res.ok) {
                hideLoginModal();
                await submitBooking();  // Auto-submit after login
            } else {
                errorMsg.textContent = data.error || 'Login failed';
                errorEl.classList.remove('hidden');
            }
        } catch {
            errorMsg.textContent = 'Network error';
            errorEl.classList.remove('hidden');
        }
    });

    // Cancel button
    document.getElementById('cancel-login').addEventListener('click', hideLoginModal);

    function setupFormSubmissionHandlerNew() {
        const form = document.getElementById('final-booking-form');
        if (!form) return;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const loggedIn = await isLoggedIn();
            if (loggedIn) {
                await submitBooking();
            } else {
                showLoginModal();
            }
        });
        document.getElementById('selected-time')?.addEventListener('change', updateSelectedServicesSummary);
        document.getElementById('stylist-select')?.addEventListener('change', updateSelectedServicesSummary);
    }

    // Handle HTMX responses for employee dropdown
    document.body.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.target && e.detail.target.id === 'stylist-select') {
            try {
                const employees = JSON.parse(e.detail.xhr.responseText);
                let options = '<option value="">Select a stylist</option>';
                if (Array.isArray(employees)) {
                    employees.forEach(emp => {
                        options += `<option value="${emp.employeeId}">${emp.firstName} ${emp.lastName}</option>`;
                    });
                }
                e.detail.target.innerHTML = options;
                checkFormComplete();
            } catch (error) {
                console.error('Error parsing employees:', error);
                e.detail.target.innerHTML = '<option value="">No available stylists</option>';
                checkFormComplete();
            }
        }
    });

    function initializeBookingForm() {
        console.log("Initializing booking form...");
        setMinDate();
        generateTimeGrid(); // Initial generation with disabling
        updateSelectedServicesSummary();  // FIXED: Call this immediately to load from sessionStorage
        setupFormSubmissionHandlerNew();

        // Event listeners (updated: regenerate time grid on date change)
        const locationSelect = document.getElementById('location-select');
        const dateInput = document.getElementById('date-input');
        const stylistSelect = document.getElementById('stylist-select');

        if (locationSelect) locationSelect.addEventListener('change', () => { triggerAvailableEmployees(); checkFormComplete(); updateSelectedServicesSummary(); });
        if (dateInput) {
            dateInput.addEventListener('change', () => {
                generateTimeGrid(); // Regenerate times with new date (enables/disables past times)
                triggerAvailableEmployees();
                checkFormComplete();
                updateSelectedServicesSummary();
            });
        }
        if (stylistSelect) stylistSelect.addEventListener('change', () => { checkFormComplete(); updateSelectedServicesSummary(); });

        console.log("Booking form initialized - Summary updated from storage");
    }

    // ... (Include all other unchanged functions: getSelectedServiceIds, getSelectedServiceDetails, updateSelectedServicesSummary here if not already defined above)

    function getSelectedServiceIds() {
        const selected = sessionStorage.getItem('selectedServiceIds');
        return selected ? JSON.parse(selected) : [];
    }

    function getSelectedServiceDetails() {
        const storedDetails = sessionStorage.getItem('selectedServicesDetails');
        if (storedDetails) {
            console.log('Using stored service details from sessionStorage');
            return JSON.parse(storedDetails);
        }
        // Fallback to DOM query (for initial selection page)
        const serviceIds = getSelectedServiceIds();
        const serviceCheckboxes = document.querySelectorAll('.service-checkbox');
        if (serviceCheckboxes.length === 0 && serviceIds.length > 0) {
            console.warn('DOM checkboxes not found, but IDs exist - relying on stored details');
            return []; // Will be caught by storedDetails above
        }
        const details = Array.from(serviceCheckboxes)
            .filter(checkbox => serviceIds.includes(checkbox.value))
            .map(checkbox => {
                const label = checkbox.closest('label');
                const nameElement = label.querySelector('span.font-semibold');
                const durationElement = label.querySelector('span.text-sm');
                const priceElement = label.querySelector('span.text-xl');
                return {
                    id: checkbox.value,
                    name: nameElement ? nameElement.textContent : 'Service',
                    duration: parseInt(checkbox.getAttribute('data-duration') || '0'),
                    price: parseFloat(priceElement ? priceElement.textContent.replace(' SEK', '') : 0)
                };
            });
        // If details found, store them for later use (best practice: cache to avoid repeated DOM queries)
        if (details.length > 0) {
            sessionStorage.setItem('selectedServicesDetails', JSON.stringify(details));
        }
        return details;
    }

    function updateSelectedServicesSummary() {
        const serviceIds = getSelectedServiceIds();
        const summaryElement = document.getElementById('selected-services-summary');
        const selectedTime = document.getElementById('selected-time')?.value || 'Not selected';
        const selectedStylist = document.getElementById('stylist-select')?.options[document.getElementById('stylist-select')?.selectedIndex]?.text || 'Not selected';

        if (!summaryElement) {
            console.warn('Summary element not found');
            return;
        }

        console.log('Updating summary - Service IDs:', serviceIds, 'Time:', selectedTime, 'Stylist:', selectedStylist);

        if (serviceIds.length === 0) {
            // Improved fallback: Use DaisyUI alert for better UX instead of plain text
            summaryElement.innerHTML = `
            <div class="alert alert-warning shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                <span>No services selected yet. Please choose from the list above.</span>
            </div>
        `;
            return;
        }

        const selectedServices = getSelectedServiceDetails();
        console.log('Fetched service details:', selectedServices);

        if (selectedServices.length === 0) {
            summaryElement.innerHTML = `
            <div class="alert alert-info shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-info shrink-0 w-6 h-6"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span>Services selected but details not loaded. Please select again.</span>
            </div>
        `;
            return;
        }

        // Calculate totals using reduce (modern, efficient way)
        const totalDuration = selectedServices.reduce((sum, s) => sum + s.duration, 0);
        const totalPrice = selectedServices.reduce((sum, s) => sum + s.price, 0);

        // Build HTML with DaisyUI card, divided list, icons, and badges
        let summaryHTML = `
        <div class="card bg-base-100 shadow-md">
            <div class="card-body p-4">
                <h2 class="card-title text-lg font-bold mb-2 flex items-center">
                    <svg class="w-5 h-5 mr-2 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path>
                    </svg>
                    Booking Summary
                </h2>
                <ul class="divide-y divide-gray-200">
    `;

        selectedServices.forEach(service => {
            summaryHTML += `
            <li class="py-2 flex justify-between items-center">
                <div class="flex items-center">
                    <svg class="w-4 h-4 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="font-medium">${service.name}</span>
                </div>
                <div class="text-right">
                    <div class="text-sm text-gray-600">${service.duration} min</div>
                    <span class="badge badge-primary font-bold">${service.price} SEK</span>
                </div>
            </li>
        `;
        });

        summaryHTML += `
                </ul>
                <div class="mt-4 pt-2 border-t border-gray-300 font-bold flex justify-between">
                    <span>Total:</span>
                    <div class="text-right">
                        <div class="text-sm">${totalDuration} min</div>
                        <span class="badge badge-lg badge-secondary">${totalPrice} SEK</span>
                    </div>
                </div>
                <div class="mt-4 grid grid-cols-2 gap-2 text-sm">
                    <div class="p-2  rounded flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        Time: ${selectedTime}
                    </div>
                    <div class="p-2  rounded flex items-center">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                        Stylist: ${selectedStylist}
                    </div>
                </div>
            </div>
        </div>
    `;

        summaryElement.innerHTML = summaryHTML;
        console.log('Summary updated successfully');
    }

    //main set up
    document.addEventListener('DOMContentLoaded', function() {
        initializeServiceSelection();
        if (document.getElementById('final-booking-form')) {
            initializeBookingForm();
        }

        // Re-init after HTMX swaps
        document.body.addEventListener('htmx:afterSwap', function(event) {
            if (event.detail.target.id === 'booking-section') {
                console.log('HTMX swap - re-initializing');
                setTimeout(() => {  // Delay to ensure DOM is ready
                    if (document.getElementById('service-selection-form')) {
                        initializeServiceSelection();
                    }
                    if (document.getElementById('final-booking-form')) {
                        initializeBookingForm();
                    }
                }, 100);
            }
        });

        // HTMX afterRequest for stylists (unchanged, but with name fix)
        document.body.addEventListener('htmx:afterRequest', function(e) {
            if (e.detail.target && e.detail.target.id === 'stylist-select') {
                try {
                    const employees = JSON.parse(e.detail.xhr.responseText);
                    let options = '<option value="">Select a stylist</option>';
                    if (Array.isArray(employees)) {
                        employees.forEach(emp => {
                            options += `<option value="${emp.employeeId}">${emp.firstName} ${emp.lastName}</option>`;
                        });
                    }
                    e.detail.target.innerHTML = options;
                    checkFormComplete();
                    updateSelectedServicesSummary();  // Update after stylists load
                } catch (error) {
                    console.error('Error parsing employees:', error);
                    e.detail.target.innerHTML = '<option value="">No available stylists</option>';
                }
            }
        });
    });
</script>

</body>
</html>
