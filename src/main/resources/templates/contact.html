<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - The Glow Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="min-h-screen bg-base-200">
<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Hero Section -->
<section class="hero min-h-[50vh] bg-cover bg-center" style="background-image: url('/images/contact-bg.jpg');">
    <div class="hero-overlay bg-black/50"></div>
    <div class="hero-content text-center text-neutral-content">
        <div class="max-w-lg">
            <h1 class="mb-5 text-5xl font-bold">Get In Touch</h1>
            <p class="mb-8 text-xl">We'd love to hear from you. Send us a message and we'll respond as soon as possible.</p>
        </div>
    </div>
</section>

<!-- Contact Form -->
<section class="py-16 px-4">
    <div class="container mx-auto max-w-4xl">
        <div class="grid md:grid-cols-2 gap-12 items-center">
            <!-- Contact Info -->
            <div class="space-y-6">
                <h2 class="text-3xl font-bold mb-4">Contact Information</h2>
                <div class="space-y-4">
                    <div class="flex items-center space-x-4">
                        <div class="bg-primary p-3 rounded-full">
                            <svg class="w-6 h-6 text-primary-content" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="font-semibold">Email</p>
                            <p class="text-base-content/70">hello@glowsalon.com</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="bg-primary p-3 rounded-full">
                            <svg class="w-6 h-6 text-primary-content" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="font-semibold">Phone</p>
                            <p class="text-base-content/70">+46 70 123 4567</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="bg-primary p-3 rounded-full">
                            <svg class="w-6 h-6 text-primary-content" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </div>
                        <div>
                            <p class="font-semibold">Address</p>
                            <p class="text-base-content/70">123 Glow Street, Limhamn, Malmö</p>
                        </div>
                    </div>
                </div>
                <div class="divider"></div>
                <p class="text-base-content/70">Business Hours:</p>
                <ul class="text-sm space-y-1">
                    <li>Monday - Sunday: 9:00 AM - 17:00 PM</li>
<!--                    <li>Saturday: 10:00 AM - 6:00 PM</li>-->
<!--                    <li>Sunday: Closed</li>-->
                </ul>
            </div>

            <!-- Contact Form -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title text-2xl mb-6">Send us a Message</h2>
                    <form hx-post="/api/contact" hx-target="#response" hx-swap="innerHTML">
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">Your Name</span>
                            </label>
                            <input type="text" name="name" placeholder="Enter your name" class="input input-bordered" required />
                        </div>
                        <div class="form-control mb-4">
                            <label class="label">
                                <span class="label-text">Email</span>
                            </label>
                            <input type="email" name="email" placeholder="Enter your email" class="input input-bordered" required />
                        </div>
                        <div class="form-control mb-6">
                            <label class="label">
                                <span class="label-text">Message</span>
                            </label>
                            <textarea name="message" placeholder="Your message" class="textarea textarea-bordered" rows="4" required></textarea>
                        </div>
                        <div class="form-control">
                            <button type="submit" class="btn btn-primary w-full">Send Message</button>
                        </div>
                    </form>
                    <div id="response" class="mt-4"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // Simple contact form handler
    document.body.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.target.id === 'response') {
            if (e.detail.xhr.status === 200) {
                e.detail.target.innerHTML = `
                    <div class="alert alert-success">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Thank you! Your message has been sent. We'll get back to you soon.</span>
                    </div>
                `;
                e.detail.elt.closest('form').reset();
            } else {
                e.detail.target.innerHTML = `
                    <div class="alert alert-error">
                        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Oops! Something went wrong. Please try again.</span>
                    </div>
                `;
            }
        }
    });
</script>
</body>
</html>
