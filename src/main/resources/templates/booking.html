<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>
    <meta charset="UTF-8">
    <title>Booking - The Glow Salon</title>
    <!-- Tailwind CSS + DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    <!-- Heroicons for icons (CDN) -->
    <script src="https://unpkg.com/heroicons@2.0.18/dist/heroicons.js"></script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-base-200 to-base-300">
<header class="shadow-lg bg-base-100">
    <div class="navbar shadow">
        <div class="navbar-start">
            <a href="/salon/services" class="btn btn-ghost text-xl">The Glow Salon</a>
        </div>
        <div class="navbar-end px-6">
            <a href="/dashboard" class="btn btn-ghost">Dashboard</a>
            <form action="/logout" method="post" class="m-0 inline">
                <button type="submit" class="btn btn-primary rounded-full">Logout</button>
            </form>
        </div>
    </div>
</header>

<!-- Booking Section -->
<section class="py-12 px-4">
    <!-- Progress Bar -->
    <div class="progress progress-primary w-full mb-8">
        <div class="progress-bar" style="width: 50%;"></div> <!-- Adjust based on steps -->
    </div>

    <div class="card bg-base-100 shadow-xl max-w-4xl mx-auto">
        <div class="card-body p-8">
            <h2 class="text-3xl text-center mb-6 font-bold text-primary">Complete Your Booking</h2>
            <p class="text-center mb-8 text-base-content/70">Selected Service: <span th:text="${serviceId} + ' (Details will be loaded)'" class="font-semibold text-primary">Selected Service</span></p>

            <form id="booking-form" hx-post="/api/appointments/book" hx-ext="json-enc" hx-target="#response" hx-swap="innerHTML">
                <!-- Hidden input for service ID -->
                <input type="hidden" name="serviceId" th:value="${serviceId}">

                <!-- Location Selection Card -->
                <div class="form-control mb-8">
                    <label class="label">
                        <span class="label-text flex items-center"><svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>Select Location</span>
                    </label>
                    <select name="locationId" id="location-select" class="select select-bordered w-full" required>
                        <option value="">Select Location</option>
                        <option value="1">Main Salon - Downtown</option>
                        <option value="2">Branch Salon - Uptown</option>
                    </select>
                </div>

                <!-- Date Selection: Enhanced Calendar Grid -->
                <div class="form-control mb-8">
                    <label class="label">
                        <span class="label-text flex items-center"><svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>Select Date</span>
                    </label>
                    <div id="date-grid" class="grid grid-cols-7 gap-1 bg-base-200 p-4 rounded-lg border border-base-300"></div>
                    <input type="hidden" name="date" id="selected-date" value="">
                    <div id="selected-date-display" class="mt-2 text-center font-medium text-primary"></div>
                </div>

                <!-- Time Selection: Enhanced Time Grid -->
                <div class="form-control mb-8">
                    <label class="label">
                        <span class="label-text flex items-center"><svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>Select Time</span>
                    </label>
                    <div id="time-grid" class="grid grid-cols-4 md:grid-cols-6 gap-2 bg-base-200 p-4 rounded-lg border border-base-300 max-h-48 overflow-y-auto"></div>
                    <input type="hidden" name="time" id="selected-time" value="">
                    <div id="selected-time-display" class="mt-2 text-center font-medium text-primary"></div>
                </div>

                <!-- Employee Selection Card -->
                <div class="form-control mb-6">
                    <label class="label">
                        <span class="label-text flex items-center"><svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>Available Stylists</span>
                    </label>
                    <select name="employeeId" id="stylist-select" class="select select-bordered w-full" required>
                        <option value="">Select date and time first</option>
                    </select>
                </div>

                <div class="form-control">
                    <button type="submit" class="btn btn-primary w-full rounded-full shadow-lg hover:shadow-xl transition-shadow" disabled id="submit-btn">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Book Appointment
                    </button>
                </div>
            </form>

            <div id="response" class="mt-6"></div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="footer bg-base-100 text-base-content p-5 mt-auto">
    <aside>
        <h2 class="text-2xl font-bold">Glow Studio</h2>
        <p>Making you glow in every cut.</p>
    </aside>
    <nav>
        <h3 class="footer-title">Links</h3>
        <a>Home</a>
        <a>Services</a>
        <a>Book Now</a>
    </nav>
    <nav>
        <h3 class="footer-title">Contact</h3>
        <p>Email: admin@glowsalon.com</p>
        <p>Phone: 071234567</p>
    </nav>
</footer>

<script>
    // Generate Time Grid (9:00 AM to 5:30 PM, every 30 minutes) with improved styling
    function generateTimeGrid() {
        const timeGrid = document.getElementById('time-grid');
        const times = [];
        for (let hour = 9; hour <= 17; hour++) {
            times.push(`${hour.toString().padStart(2, '0')}:00`);
            if (hour < 17) {
                times.push(`${hour.toString().padStart(2, '0')}:30`);
            }
        }
        times.push('17:30');

        timeGrid.innerHTML = times.map(time => `
                <button type="button" class="btn btn-outline btn-sm rounded-full transition-all duration-200 hover:bg-primary hover:text-white ${time === document.getElementById('selected-time').value ? 'btn-primary' : ''}"
                        onclick="selectTime('${time}')">${time}</button>
            `).join('');
    }

    // Select Time Function
    function selectTime(time) {
        document.getElementById('selected-time').value = time;
        document.getElementById('selected-time-display').textContent = `Selected: ${time}`;
        document.querySelectorAll('#time-grid button').forEach(btn => btn.classList.remove('btn-primary'));
        event.target.classList.add('btn-primary');
        triggerAvailableEmployees();
        checkFormComplete();
    }

    // Generate Enhanced Calendar Grid for Current Month (starting from today)
    function generateCalendarGrid() {
        const today = new Date();
        const year = today.getFullYear();
        const month = today.getMonth();
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startingDayOfWeek = firstDay.getDay();

        const dateGrid = document.getElementById('date-grid');
        let html = `<div class="col-span-7 text-center font-bold text-sm mb-2 text-primary">${monthNames[month]} ${year}</div>`;
        html += '<div class="grid-cols-7 text-xs font-semibold text-base-content/70">Sun Mon Tue Wed Thu Fri Sat</div>';

        // Empty cells for days before 1st
        for (let i = 0; i < startingDayOfWeek; i++) {
            html += '<div class="p-2"></div>';
        }

        // Days of the month
        for (let day = 1; day <= daysInMonth; day++) {
            const date = new Date(year, month, day);
            const isTodayOrFuture = date >= today;
            const isSelected = date.toISOString().split('T')[0] === document.getElementById('selected-date').value;
            const dayClass = isTodayOrFuture ? (isSelected ? 'btn-primary' : 'btn-outline btn-sm hover:bg-primary/20 transition-colors') : 'btn-disabled btn-sm opacity-50 cursor-not-allowed';
            html += `<button type="button" class="btn ${dayClass} rounded-full" onclick="selectDate(${day}, ${month + 1}, ${year})">${day}</button>`;
        }

        dateGrid.innerHTML = html;
    }

    // Select Date Function
    function selectDate(day, month, year) {
        const selectedDateStr = `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
        document.getElementById('selected-date').value = selectedDateStr;
        document.getElementById('selected-date-display').textContent = `Selected: ${selectedDateStr}`;
        document.querySelectorAll('#date-grid button').forEach(btn => btn.classList.remove('btn-primary'));
        event.target.classList.add('btn-primary');
        triggerAvailableEmployees();
        checkFormComplete();
    }

    // Trigger HTMX for Available Employees
    function triggerAvailableEmployees() {
        const locationId = document.getElementById('location-select').value;
        const date = document.getElementById('selected-date').value;
        const time = document.getElementById('selected-time').value;
        const serviceId = document.querySelector('input[name="serviceId"]').value;

        if (locationId && date && time && serviceId) {
            const url = `/api/appointments/available-employees?locationId=${locationId}&date=${date}&time=${time}&serviceId=${serviceId}`;
            htmx.ajax('GET', url, {target: '#stylist-select', swap: 'innerHTML'});
        }
    }

    // Check if form is complete to enable submit
    function checkFormComplete() {
        const location = document.getElementById('location-select').value;
        const date = document.getElementById('selected-date').value;
        const time = document.getElementById('selected-time').value;
        const stylist = document.getElementById('stylist-select').value;
        if (location && date && time && stylist) {
            document.getElementById('submit-btn').disabled = false;
        } else {
            document.getElementById('submit-btn').disabled = true;
        }
    }

    // Event Listeners
    document.getElementById('location-select').addEventListener('change', function() {
        triggerAvailableEmployees();
        checkFormComplete();
    });

    document.getElementById('stylist-select').addEventListener('change', checkFormComplete);

    // Handle response
    document.body.addEventListener('htmx:afterRequest', function(e) {
        if (e.detail.elt.id === 'booking-form' && e.detail.successful) {
            alert('Appointment booked successfully!');
            window.location.href = '/dashboard';
        } else if (e.detail.elt.id === 'booking-form') {
            const response = JSON.parse(e.detail.xhr.responseText);
            document.getElementById('response').innerHTML = `<div class="alert alert-error shadow-lg">${response.error}</div>`;
        }
    });

    // Update stylist list from response (JSON)
    document.body.addEventListener('htmx:afterSwap', function(e) {
        if (e.detail.target.id === 'stylist-select') {
            try {
                const employees = JSON.parse(e.detail.xhr.responseText);
                let options = '<option value="">Select a stylist</option>';
                employees.forEach(emp => {
                    options += `<option value="${emp.employeeId}">${emp.name}</option>`;
                });
                e.detail.target.innerHTML = options;
                checkFormComplete();
            } catch {
                e.detail.target.innerHTML = '<option value="">No available stylists</option>';
            }
        }
    });

    // Initialize on load
    document.addEventListener('DOMContentLoaded', function() {
        generateCalendarGrid();
        generateTimeGrid();
    });
</script>
</body>
</html>
