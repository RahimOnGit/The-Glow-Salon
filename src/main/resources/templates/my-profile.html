<!DOCTYPE html>
<html lang="en" data-theme="lofi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile - The Glow Salon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet"/>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="min-h-screen bg-base-200">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Main Content -->
<div class="container mx-auto px-4 py-12">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-8">My Profile</h1>

        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <div class="space-y-6">
                    <!-- Full Name -->
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="text-sm text-base-content/70">Full Name</p>
                            <p class="text-xl font-semibold" th:text="${user.firstName} + ' ' + ${user.lastName}">
                                Loading...
                            </p>
                        </div>
                        <button class="btn btn-primary btn-sm"
                                onclick="document.getElementById('edit-profile-modal').showModal()">
                            Edit Profile
                        </button>
                    </div>

                    <!-- Email -->
                    <div>
                        <p class="text-sm text-base-content/70">Email</p>
                        <p class="text-lg" th:text="${user.email}">email@example.com</p>
                    </div>

                    <!-- Phone -->
                    <div>
                        <p class="text-sm text-base-content/70">Phone Number</p>
                        <p class="text-lg" th:text="${user.phone}">123456789</p>
                    </div>

                    <!-- Change Password Button -->
                    <div class="pt-4">
                        <button class="btn btn-outline btn-warning"
                                onclick="document.getElementById('change-password-modal').showModal()">
                            Change Password
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Edit Profile Modal -->
<dialog id="edit-profile-modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-6">Edit Profile</h3>
        <form id="edit-profile-form">
            <div class="form-control mb-4">
                <label class="label"><span class="label-text">First Name</span></label>
                <input type="text" name="firstName" th:value="${user.firstName}"
                       class="input input-bordered" required/>
            </div>

            <div class="form-control mb-4">
                <label class="label"><span class="label-text">Last Name</span></label>
                <input type="text" name="lastName" th:value="${user.lastName}"
                       class="input input-bordered" required/>
            </div>

            <div class="form-control mb-6">
                <label class="label"><span class="label-text">Phone Number</span></label>
                <input type="tel" name="phone" th:value="${user.phone}"
                       class="input input-bordered" required/>
            </div>

            <div class="modal-action">
                <button type="button" class="btn"
                        onclick="document.getElementById('edit-profile-modal').close()">Cancel
                </button>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</dialog>

<!-- Change Password Modal -->
<dialog id="change-password-modal" class="modal">
    <div class="modal-box">
        <h3 class="font-bold text-lg mb-6">Change Password</h3>
        <form id="change-password-form">
            <div class="form-control mb-4">
                <label class="label"><span class="label-text">Current Password</span></label>
                <input type="password" name="currentPassword" class="input input-bordered" required/>
            </div>

            <div class="form-control mb-6">
                <label class="label"><span class="label-text">New Password</span></label>
                <input type="password" name="newPassword" class="input input-bordered"
                       required minlength="6"/>
            </div>

            <div class="modal-action">
                <button type="button" class="btn"
                        onclick="document.getElementById('change-password-modal').close()">Cancel
                </button>
                <button type="submit" class="btn btn-primary">Update Password</button>
            </div>
        </form>
    </div>
</dialog>

<!-- Toast Notifications -->
<div id="success-toast" class="toast toast-top toast-center hidden">
    <div class="alert alert-success"><span id="success-msg"></span></div>
</div>
<div id="error-toast" class="toast toast-top toast-center hidden">
    <div class="alert alert-error"><span id="error-msg"></span></div>
</div>

<!-- Footer -->
<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    // Edit Profile – Uses /api/users/me (never needs userId)
        document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = {
            firstName: formData.get('firstName'),
            lastName: formData.get('lastName'),
            phone: formData.get('phone')
        };

        try {
            const res = await fetch('/api/users/me', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                document.getElementById('edit-profile-modal').close();
                showSuccess('Profile updated successfully');
                setTimeout(() => location.reload(), 1500);
            } else {
                const err = await res.json();
                showError(err.error || 'Update failed');
            }
        } catch {
            showError('Connection error');
        }
    });

    // Change Password – use /api/users/me/change-password
    document.getElementById('change-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const payload = {
            currentPassword: formData.get('currentPassword'),
            newPassword: formData.get('newPassword')
        };

        try {
            const res = await fetch('/api/users/me/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('change-password-modal').close();
                showSuccess('The password has been successfully changed.');
            } else {
                const err = await res.json();
                showError(err.error || 'The current password is incorrect.');
            }
        } catch {
            showError('Connection error');
        }
    });

    function showSuccess(msg) {
        document.getElementById('success-msg').textContent = msg;
        document.getElementById('success-toast').classList.remove('hidden');
        setTimeout(() => document.getElementById('success-toast').classList.add('hidden'), 4000);
    }

    function showError(msg) {
        document.getElementById('error-msg').textContent = msg;
        document.getElementById('error-toast').classList.remove('hidden');
        setTimeout(() => document.getElementById('error-toast').classList.add('hidden'), 5000);
    }
</script>

</body>
</html>
