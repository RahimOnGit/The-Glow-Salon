<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>

    <meta charset="UTF-8">
    <title>The Glow Salon</title>
    <!-- htmx and json-enc extension for sending form data as JSON -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>

    <!-- Tailwind CSS + DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
</head>
<body class="min-h-screen bg-base-200">
<!--navbar-->
<div th:replace="fragments/navbar::navbar"></div>

<!--hero section-->
<div class="hero min-h-screen bg-cover bg-center" style="background-image: url('/images/the-glow-salon.jpg');">
    <div class="hero-overlay bg-black/60"></div>
    <div class="hero-content text-center text-neutral-content">
        <div class="max-w-md">
            <h1 class="mb-5 text-5xl font-bold">We make you glow in every cut</h1>
            <p class="mb-8">Professional stylists. Modern looks.</p>
            <a href="/salon/services" class="btn btn-wide rounded text-white bg-transparent">Book Now</a>
        </div>
    </div>
</div>

<!-- Customer Welcome Section (Dynamic for Logged-in Customers) -->

<div id="customer-welcome" class="container mx-auto px-4 mt-8 mb-8 max-w-4xl" style="display: none;">
    <div class="hero min-h-32 bg-primary text-primary-content rounded-lg shadow-lg">
        <div class="hero-content text-center">
            <div class="max-w-md mx-auto">
                <h2 class="text-2xl font-bold mb-4">Welcome Back!</h2>
                <p class="mb-4">You have <span id="upcoming-count">0</span> upcoming appointment(s). Check your bookings or schedule a new one.</p>
                <div class="flex justify-center space-x-4">
                    <a href="/my-appointments" class="btn btn-secondary">View Appointments</a>
                    <a href="/salon/services" class="btn btn-secondary">Book Now</a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Services Section -->
<div id="services">
    <div th:replace="fragments/service-list::serviceOverviewFragment"></div>
</div>

<!-- Footer -->
<div th:replace="fragments/footer::footer"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch("/api/auth/status")
            .then(response => response.json())
            .then(data => {
                if (data.loggedIn && data.role === 'customer') {
                    document.getElementById('customer-welcome').style.display = 'block';
                    // Fetch upcoming appointments count
                    fetch("/api/appointments/my-appointments")
                        .then(res => res.json())
                        .then(appointments => {
                            const today = new Date();
                            today.setHours(0, 0, 0, 0); // Start of today
                            const upcoming = appointments.filter(apt => {
                                const aptDate = new Date(apt.date);
                                return aptDate >= today;
                            }).length;
                            document.getElementById('upcoming-count').textContent = upcoming;
                        })
                        .catch(() => {}); // Ignore errors
                }
            })
            .catch(() => {});
    });
</script>

</body>
</html>
