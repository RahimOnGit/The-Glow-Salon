<!DOCTYPE html>
<html lang="en" data-theme="lofi">
<head>




    <meta charset="UTF-8">
    <title>The Glow Salon</title>
    <!-- htmx and json-enc extension for sending form data as JSON -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>




    <!-- Tailwind CSS + DaisyUI CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />




    <style>
        @keyframes marquee {
            0%   { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }




        .animate-marquee {
            display: inline-block;
            animation: marquee 30s linear infinite;
            padding-left: 100%;
        }

        .transparent-navbar .navbar
        {
            background-color: transparent !important;
        }


        /*.animate-marquee:hover {
        /*    animation-play-state: paused;
        /*}
</style>
</head>
<body class="min-h-screen bg-base-200 transparent-navbar">
<!--navbar-->
<div class="absolute top-0 left-0 z-20 right-0 shadow-none border-none">
    <div th:replace="fragments/navbar::navbar"></div>


</div>




<!--hero section-->
<div class="hero min-h-screen bg-cover bg-center" style="background-image: url('/images/the-glow-salon.jpg');">
    <div class="hero-overlay bg-black/60"></div>
    <div class="hero-content text-center text-neutral-content">
        <div class="mx-auto">
            <h1 class="text-7xl font-bold">We make you glow </h1>
            <h1 class=" mb-5 font-bold text-7xl ">in every cut</h1>
            <p class="mb-10 text-xl">Professional stylists. Modern looks.</p>
            <a href="/salon/services" class="btn btn-wide rounded border-2 text-primary-content btn-lg  text-2xl bg-opacity-10">Book Now</a>
        </div>
    </div>
</div>




<!--services section-->
<div id="services " >




    <div th:replace="fragments/service-list::serviceOverviewFragment"></div>
</div>




<!--footer-->
<div th:replace="fragments/footer::footer"></div>




</body>
</html>
