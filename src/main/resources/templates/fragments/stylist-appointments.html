<th:block th:fragment="list(title, appointments)">
    <div class="space-y-4">
        <h2 th:text="${title}" class="text-xl font-bold">Today</h2>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(appointments)}" class="shadow-lg text-center py-8">
            <svg class="w-12 h-12 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <p class="text-lg">No appointments scheduled for today</p>
        </div>

        <!-- Appointments List -->
        <div th:each="appt : ${appointments}"
             class="card bg-base-100 shadow-md p-4 hover:shadow-lg transition-shadow">
            <div class="flex justify-between items-start">
                <div>
                    <p class="font-bold text-lg" th:text="${appt.customerName()}">Client</p>
                    <p class="text-sm text-gray-600" th:text="${appt.location()}">Location</p>
                </div>
                <div class="text-right">
                    <p class="font-mono"
                       th:text="${#temporals.format(appt.startTime(), 'HH:mm')} + ' - ' + ${#temporals.format(appt.startTime().plusMinutes(appt.durationInMinutes()), 'HH:mm')}">
                        10:00 - 10:30
                    </p>
                    <p class="text-sm" th:text="${#strings.listJoin(appt.serviceNames(), ', ')}">Cut</p>
                </div>
            </div>

            <!-- Status and Complete Button -->
            <div class="flex justify-between items-center mt-4 pt-4 border-t border-gray-200">
                <!-- Status  -->
                <span th:classappend="${appt.status().name() == 'COMPLETED'} ?
                                      'badge badge-success' :
                                      'badge badge-warning'"
                      th:text="${appt.status()}">
                    Pending
                </span>

                <!-- Complete Button -->
                <button th:if="${appt.status().name() != 'COMPLETED'}"
                        class="btn btn-success btn-sm"
                        th:data-appointment-id="${appt.id()}"
                        onclick="completeAppointment(this)">
                    Complete
                </button>

                <!-- Show message if already completed -->
                <span th:if="${appt.status().name() == 'COMPLETED'}"
                      class="text-success font-semibold">
                    ✓ Completed
                </span>
            </div>
        </div>
    </div>
</th:block>
