<div th:fragment="serviceOverviewFragment" class="py-16 overflow-hidden bg-base-350">
    <h2 class="text-4xl text-center mb-16 font-bold text-neutral-focus text-secondary opacity-50">Our Services</h2>


    <!-- Animated Marquee-->
    <div class="relative my-8">
        <div class="animate-marquee whitespace-nowrap">
            <th:block th:each="service, iterStat : ${services}">
               <span class="inline-block mx-8 text-5xl  text-base-content p-8 font-semibold   px-10"
                     th:text="${service.name}">Hair Cut</span>
                <!-- Duplicate for loop -->
                <span th:if="${iterStat.last}" class="inline-block mx-8 text-2xl font-semibold text-primary opacity-0"
                      th:text="${service.name}">Hair Cut</span>
            </th:block>


            <!-- Repeat infinite loop -->
            <th:block th:each="service : ${services}">
               <span class="inline-block mx-8 text-2xl font-semibold text-primary"
                     th:text="${service.name}">Hair Cut</span>
            </th:block>
        </div>
    </div>


</div>
<script>
    function getSelectedServiceIds() {
        const selected = sessionStorage.getItem('selectedServiceIds');
        return selected ? JSON.parse(selected) : [];
    }
    function setupFormSubmissionHandler() {
        const form = document.getElementById('final-booking-form');
        if (!form) return;


        // Remove HTMX attributes and handle submission manually
        form.removeAttribute('hx-post');
        form.removeAttribute('hx-trigger');
        form.removeAttribute('hx-target');
        form.removeAttribute('hx-swap');
        form.removeAttribute('hx-ext');


        form.addEventListener('submit', async function(event) {
            event.preventDefault();


            const serviceIds = getSelectedServiceIds();
            console.log("[v0] Form submission - serviceIds from sessionStorage:", serviceIds);


            if (serviceIds.length === 0) {
                alert('Please select at least one service');
                return;
            }


            // Get form data
            const formData = new FormData(form);


            // Build JSON payload
            const payload = {
                serviceIds: serviceIds.map(id => parseInt(id)),
                employeeId: parseInt(formData.get('employeeId')),
                locationId: parseInt(formData.get('locationId')),
                date: formData.get('date'),
                time: formData.get('time')
            };


            console.log("Sending payload:", JSON.stringify(payload));


            try {
                const response = await fetch('/api/appointments/book', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });


                const result = await response.json();
                const responseElement = document.getElementById('response');


                if (response.ok) {
                    responseElement.innerHTML = `
                   <div class="alert alert-success">
                       <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                       </svg>
                       <span>${result.message || 'Appointment booked successfully!'}</span>
                   </div>
               `;
                    // Clear form or redirect if needed
                    form.reset();
                    sessionStorage.removeItem('selectedServiceIds');
                    updateSelectedServicesSummary();
                } else {
                    responseElement.innerHTML = `
                   <div class="alert alert-error">
                       <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                           <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                       </svg>
                       <span>${result.error || 'Failed to book appointment'}</span>
                   </div>
               `;
                }
            } catch (error) {
                console.error('Error booking appointment:', error);
                const responseElement = document.getElementById('response');
                responseElement.innerHTML = `
               <div class="alert alert-error">
                   <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                   </svg>
                   <span>Network error: ${error.message}</span>
               </div>
           `;
            }
        });
    }




    document.addEventListener('DOMContentLoaded', function() {
        setupFormSubmissionHandler();
    });


    // Also setup handler when booking form is loaded via HTMX swap
    // // document.addEventListener('htmx:afterSwap', function(event) {
    // //     if (event.detail.xhr.responseURL.includes('booking-form')) {
    // //         setupFormSubmissionHandler();
    // //     }
    // });
</script>
