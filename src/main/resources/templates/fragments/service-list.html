<div th:fragment="service-list" class="my-12 p-4 bg-base-100 rounded-xl shadow-2xl max-w-2xl mx-auto">
  <h2 class="text-3xl text-center mb-8 font-bold text-neutral-focus">Select Our Services</h2>

  <div class="space-y-4">
    <th:block th:each="service : ${services}">
      <label class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-md transition duration-200 hover:shadow-xl hover:border-primary cursor-pointer">

        <div class="flex items-center space-x-3 ">
          <input type="checkbox"
                 name="serviceIds"
                 class="checkbox checkbox-lg checkbox-primary"
                 th:value="${service.serviceId}"
                 th:data-name="${service.name}"
                 th:data-duration="${service.duration}"
                 th:data-price="${service.price}"
          >
          <span class="font-semibold text-lg text-neutral" th:text="${service.name}">Service Title</span>
        </div>

        <div class="text-right flex flex-col items-end space-y-1">
          <span class="text-sm text-gray-500 font-medium" th:text="${service.duration} + ' min'">Duration</span>
          <span class="text-xl font-extrabold text-primary" th:text="${service.price} + ' kr'">Price</span>
        </div>
      </label>
    </th:block>
  </div>
</div>
