<div th:fragment="service-list" class="my-12 p-4 bg-base-100 rounded-xl shadow-2xl max-w-2xl mx-auto">
    <h2 class="text-3xl text-center mb-8 font-bold text-neutral-focus">Select Our Services</h2>

    <form id="service-selection-form">
        <div class="space-y-4">
            <th:block th:each="service : ${services}">
                <label class="flex items-center justify-between p-4 bg-white border border-gray-200 rounded-lg shadow-md transition duration-200 hover:shadow-xl hover:border-primary cursor-pointer">

                    <div class="flex items-center space-x-3 ">
                        <input type="checkbox"
                               class="checkbox checkbox-lg checkbox-primary service-checkbox"
                               name="serviceId"
                               th:value="${service.serviceId}"
                               th:data-duration="${service.duration}"
                        >
                        <span class="font-semibold text-lg text-neutral" th:text="${service.name}">Service Title</span>
                    </div>

                    <div class="text-right flex flex-col items-end space-y-1">
                        <span class="text-sm text-gray-500 font-medium" th:text="${service.duration} + ' min'">Duration</span>
                        <span class="text-xl font-extrabold text-primary" th:text="${service.price} + ' kr'">Price</span>
                    </div>
                </label>
            </th:block>
        </div>

        <div class="mt-8 text-center">
            <button
                    id="continue-to-booking"
                    class="btn btn-primary btn-lg w-full max-w-xs "
                    hx-get="/booking-form-fragment"
                    hx-target="#booking-section"
                    hx-swap="innerHTML"
                    disabled
                    type="button">
                Continue to Booking ->
            </button>
        </div>
    </form>
</div>

<div th:fragment="booking-form">
    <section class="py-12 px-4">
        <div class="card bg-base-100 shadow-xl max-w-4xl mx-auto">
            <div class="card-body p-8">
                <h2 class="text-3xl text-center mb-6 font-bold text-primary">Complete Your Booking</h2>

                <form id="final-booking-form">

                    <!-- ADD: Selected Services Summary -->
                    <div class="form-control mb-6 bg-base-200 p-4 rounded-lg">
                        <label class="label">
                            <span class="label-text font-semibold">Selected Services</span>
                        </label>
                        <div id="selected-services-summary" class="space-y-2">
                            <p class="text-gray-500">No services selected</p>
                        </div>
                    </div>

                    <!-- location-->
                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text">Select Location</span>
                        </label>
                        <select id="location-select" name="locationId" class="select select-bordered w-full" required>
                            <option value="">Select Location</option>
                            <th:block th:each="loc : ${locations}">
                                <option th:value="${loc.locationId}" th:text="${loc.name}"></option>
                            </th:block>
                        </select>
                    </div>

                    <!-- Date -->
                    <div class="form-control mb-6">
                        <label class="label">
              <span class="label-text flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                Select Date
              </span>
                        </label>
                        <input type="date" name="date" id="date-input" class="input input-bordered w-full" required>
                    </div>

                    <!-- Time Selection -->
                    <div class="form-control mb-8">
                        <label class="label">
              <span class="label-text flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                Select Time
              </span>
                        </label>
                        <div id="time-grid" class="grid grid-cols-4 md:grid-cols-6 gap-2 bg-base-200 p-4 rounded-lg border border-base-300 max-h-48 overflow-y-auto"></div>
                        <input type="hidden" name="time" id="selected-time" value="">
                        <div id="selected-time-display" class="mt-2 text-center font-medium text-primary"></div>
                    </div>

                    <!-- stylist cards -->
                    <div class="form-control mb-6">
                        <label class="label">
              <span class="label-text flex items-center">
                <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
                Available Stylists
              </span>
                        </label>
                        <div id="stylist-cards" class="grid grid-cols-1 md:grid-cols-2 gap-4 max-h-64 overflow-y-auto bg-base-200 p-4 rounded-lg border border-base-300">
                            <p class="text-center text-gray-500 col-span-full">Select date, time, and location to see available stylists.</p>
                        </div>
                        <input type="hidden" name="employeeId" id="selected-employee" value="">
                        <div id="selected-stylist-display" class="mt-2 text-center font-medium text-primary"></div>
                    </div>

                    <div class="form-control">
                        <button type="submit" class="btn btn-primary w-full rounded-full shadow-lg hover:shadow-xl transition-shadow" disabled id="submit-btn">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                            </svg>
                            Book Appointment
                        </button>
                    </div>
                </form>

                <div id="response" class="mt-6"></div>
            </div>
        </div>
    </section>
</div>

<div th:fragment="serviceOverviewFragment" class=" py-10 bg-base-300">
    <h2 class="text-2xl text-center mb-10 font-bold ">Our Services</h2>
    <div class="grid md:grid-cols-2 gap-6 max-w-2xl mx-auto ">
        <th:block th:each="service : ${services}">

            <div class="py-8 bg-black text-center text-white  rounded shadow-md hover:shadow-lg transition">
                <h3 class="font-semibold text-lg" th:text="${service.name}">Service Name</h3>
            </div>
        </th:block>
    </div>
</div>

<script>
    function getSelectedServiceIds() {
        const selected = sessionStorage.getItem('selectedServiceIds');
        return selected ? JSON.parse(selected) : [];
    }
    function setupFormSubmissionHandler() {
        const form = document.getElementById('final-booking-form');
        if (!form) return;

        // Remove HTMX attributes and handle submission manually
        form.removeAttribute('hx-post');
        form.removeAttribute('hx-trigger');
        form.removeAttribute('hx-target');
        form.removeAttribute('hx-swap');
        form.removeAttribute('hx-ext');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const serviceIds = getSelectedServiceIds();
            console.log("[v0] Form submission - serviceIds from sessionStorage:", serviceIds);

            if (serviceIds.length === 0) {
                alert('Please select at least one service');
                return;
            }

            // Get form data
            const formData = new FormData(form);

            // Build JSON payload
            const payload = {
                serviceIds: serviceIds.map(id => parseInt(id)),
                employeeId: parseInt(formData.get('employeeId')),
                locationId: parseInt(formData.get('locationId')),
                date: formData.get('date'),
                time: formData.get('time')
            };

            console.log("Sending payload:", JSON.stringify(payload));

            try {
                const response = await fetch('/api/appointments/book', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                const responseElement = document.getElementById('response');

                if (response.ok) {
                    responseElement.innerHTML = `
                    <div class="alert alert-success">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        <span>${result.message || 'Appointment booked successfully!'}</span>
                    </div>
                `;
                    // Clear form or redirect if needed
                    form.reset();
                    sessionStorage.removeItem('selectedServiceIds');
                    updateSelectedServicesSummary();
                } else {
                    responseElement.innerHTML = `
                    <div class="alert alert-error">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                        <span>${result.error || 'Failed to book appointment'}</span>
                    </div>
                `;
                }
            } catch (error) {
                console.error('Error booking appointment:', error);
                const responseElement = document.getElementById('response');
                responseElement.innerHTML = `
                <div class="alert alert-error">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                    <span>Network error: ${error.message}</span>
                </div>
            `;
            }
        });
    }


    document.addEventListener('DOMContentLoaded', function() {
        setupFormSubmissionHandler();
    });

    // Also setup handler when booking form is loaded via HTMX swap
    // // document.addEventListener('htmx:afterSwap', function(event) {
    // //     if (event.detail.xhr.responseURL.includes('booking-form')) {
    // //         setupFormSubmissionHandler();
    // //     }
    // });
</script>
