<div class="space-y-4 max-w-xl mx-auto">
  <th:block th:each="service : ${services}">
    <label class="flex justify-between items-center bg-white p-4 rounded-xl shadow-md cursor-pointer hover:shadow-lg transition">
      <input type="checkbox"
             class="checkbox checkbox-primary"
             th:value="${service.serviceId}"
             th:data-name="${service.name}"
             th:data-duration="${service.duration}"
             th:data-price="${service.price}"
      >
      <span class="font-medium" th:text="${service.name}">Service title</span>
      <span class="text-gray-500" th:text="${service.duration} + ' min'">Service duration</span>
      <span class="rounded-full border px-4 py-1 font-semibold text-primary" th:text="${service.price} + ' kr'">Price</span>
    </label>
  </th:block>
</div>
