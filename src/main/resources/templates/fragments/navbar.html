<header class="shadow-inner py-3" th:fragment="navbar">
    <div class="navbar bg-base-100 shadow-lg">
        <div class="navbar-start">
            <a href="/" class="btn btn-ghost text-3xl font-bold text-primary">The Glow Salon</a>
        </div>
        <div class="navbar-center hidden lg:flex">
            <ul class="menu menu-horizontal px-1 text-lg">
                <li><a href="/" class="hover:text-primary transition-colors">Home</a></li>
                <li><a href="/salon/services" class="hover:text-primary transition-colors">Services</a></li>
                <li><a href="/salon/services" class="hover:text-primary transition-colors">Booking</a></li>
                <li><a href="#" class="hover:text-primary transition-colors">Contact</a></li>
            </ul>
        </div>
        <div class="navbar-end px-6">
            <a href="/login" id="login-link" class="btn btn-primary rounded-full hidden">Login</a>
            <div id="profile-dropdown" class="hidden">
                <div class="dropdown dropdown-end">
                    <label tabindex="0" class="btn btn-ghost btn-circle avatar relative">
                        <div class="w-9 rounded-full ring ring-primary ring-offset-base-100 ring-offset-2">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block w-8 h-8 stroke-current text-base-content">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <div class="absolute -top-1 -right-1" id="notification-badge" style="display: none;">
                            <div class="w-6 h-6 rounded-full bg-error flex items-center justify-center text-white text-xs font-bold" id="upcoming-badge">0</div>
                        </div>
                    </label>
                    <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow-xl bg-base-100 rounded-box w-64 border border-base-200">
                        <li class="menu-title px-4 py-2">
                            <span class="text-sm font-semibold text-base-content">Welcome Back!</span>
                        </li>
                        <li class="px-4 py-2">
                            <span class="text-sm font-medium text-base-content/80">Hello, <span id="user-name">User</span></span>
                        </li>
                        <li><a href="/my-appointments" class="justify-between hover:bg-base-200 rounded-lg transition-colors">
                            <span>My Appointments</span>
                            <span class="badge badge-secondary text-xs" id="appointments-badge">0</span>
                        </a></li>
                        <li><a href="/dashboard" class="justify-between hover:bg-base-200 rounded-lg transition-colors">
                            <span>Dashboard</span>
                        </a></li>
                        <li><hr class="my-1"></li>
                        <li><a href="/logout" class="hover:bg-error hover:text-error-content rounded-lg transition-colors">Logout</a></li>
                    </ul>
                    <ul tabindex="0" class="menu menu-sm dropdown-content mt-3 z-[1] p-2 shadow-xl bg-base-100 rounded-box w-64 border border-base-200" id="mobile-menu" style="display: none;">
                        <!-- Mobile version if needed -->
                    </ul>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetch("/api/auth/status")
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    console.log("Auth status received:", data);
                    const loginLink = document.getElementById("login-link");
                    const profileDropdown = document.getElementById("profile-dropdown");
                    const notificationBadge = document.getElementById("notification-badge");
                    if (data.loggedIn) {
                        console.log("User is logged in, showing profile dropdown");
                        if (loginLink) loginLink.classList.add("hidden");
                        if (profileDropdown) profileDropdown.classList.remove("hidden");
                        document.getElementById('user-name').textContent = data.firstName || 'User';
                        // Fetch pending upcoming count
                        fetch("/api/appointments/pending-count")
                            .then(res => res.json())
                            .then(count => {
                                const badgeElements = [document.getElementById('upcoming-badge'), document.getElementById('appointments-badge')];
                                badgeElements.forEach(el => {
                                    if (el) el.textContent = count;
                                });
                                if (count > 0) {
                                    notificationBadge.style.display = 'block';
                                }
                            })
                            .catch(err => console.error('Failed to fetch pending count:', err));
                        if (data.role === 'customer') {
                            const menu = document.querySelector('.menu-horizontal');
                            if (menu && !menu.querySelector('a[href="/my-appointments"]')) {
                                const li = document.createElement('li');
                                li.innerHTML = '<a href="/my-appointments" class="font-semibold hover:text-primary transition-colors">My Appointments</a>';
                                menu.insertBefore(li, menu.lastElementChild);
                            }
                        }
                    } else {
                        console.log("User is not logged in, showing login button");
                        if (loginLink) loginLink.classList.remove("hidden");
                        if (profileDropdown) profileDropdown.classList.add("hidden");
                        if (notificationBadge) notificationBadge.style.display = 'none';
                    }
                })
                .catch(error => {
                    console.error("Error checking auth status:", error);
                    // Fallback: show login button
                    const loginLink = document.getElementById("login-link");
                    const profileDropdown = document.getElementById("profile-dropdown");
                    if (loginLink) loginLink.classList.remove("hidden");
                    if (profileDropdown) profileDropdown.classList.add("hidden");
                });
        });
    </script>
</header>
